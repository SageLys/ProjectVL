<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>魅魔心防战｜可玩原型</title>
</head>
<body>
  <main class="game-shell">
    <header class="game-hud" aria-label="战斗状态">
      <div class="hud-vital">
        <div class="bar"><i id="hpBar"></i></div>
        <span>HP <b id="hpText">100</b> / 100</span>
      </div>
      <div class="hud-progress">
        <strong>波次 <span id="waveText">0</span>/<span id="totalWavesText">5</span></strong>
        <span>Lv.<span id="levelText">1</span> · <span id="xpText">0</span>/<span id="xpNeed">8</span></span>
        <div class="bar xp"><i id="xpBar" style="width:0%"></i></div>
      </div>
      <button class="hud-pause" id="pauseBtn" aria-label="暂停">Ⅱ</button>
    </header>

    <section class="arena" id="arena">
      <canvas id="game" width="540" height="960" aria-label="主画面释放区"></canvas>
      <div class="center-msg" id="centerMsg"><h2>守住心防</h2><p>点击拾取心意，拖卡到画面释放</p></div>
      <div class="toast" id="toast"></div>
      <div class="aim-preview" id="aimPreview" aria-hidden="true"><i></i></div>
      <div class="screen-preview" id="screenPreview" aria-hidden="true"></div>
    </section>

    <section class="game-dock" id="dock" aria-label="拇指操作区">
      <div class="dock-row equipment-row" id="equipmentBar">
        <div class="dock-label"><strong>装备</strong><small id="equipmentHint">S1b 开放</small></div>
        <div class="equipment-slots" id="equipmentSlots" aria-label="装备占位格"></div>
        <div class="dock-telemetry" id="dropTelemetry">地面 0 · 已拾取 0 · 超时 0</div>
      </div>
      <div class="dock-row hand-row">
        <div class="dock-label"><strong>手牌</strong><small id="cardsHint">自动合成 · 拖入画面释放</small></div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="dock-actions">
        <button class="btn primary" id="startBtn">开始游戏</button>
        <button class="btn" id="testCardBtn">生成测试掉落</button>
      </div>
    </section>
  </main>

  <details class="dev-tools">
    <summary>开发调参</summary>
    <div class="dev-tools-body">
      <div class="stats">
        <span>伤害 <b id="damageStat">16</b></span><span>射速 <b id="rateStat">3.3/s</b></span><span>弹丸 <b id="multiStat">1</b></span>
      </div>
      <div class="tuner">
        <label>基础伤害 <output id="damageCtlVal">16</output><input id="damageCtl" data-testid="damage-control" type="range" min="6" max="40" value="16" step="1"></label>
        <label>每秒攻击 <output id="rateCtlVal">3.3</output><input id="rateCtl" data-testid="rate-control" type="range" min="1" max="10" value="3.3" step="0.1"></label>
        <label>攻击射程 <output id="rangeCtlVal">320</output><input id="rangeCtl" data-testid="range-control" type="range" min="100" max="420" value="320" step="10"></label>
        <label>掉落概率 <output id="dropCtlVal">50%</output><input id="dropCtl" data-testid="drop-control" type="range" min="0" max="100" value="50" step="5"></label>
        <label>存在时间 <output id="lifeCtlVal">6.0秒</output><input id="lifeCtl" data-testid="life-control" type="range" min="2" max="15" value="6" step="0.5"></label>
        <label>追求者速度 <output id="speedCtlVal">100%</output><input id="speedCtl" data-testid="speed-control" type="range" min="40" max="180" value="100" step="10"></label>
        <label>配置 Variant <select id="variantSel" data-testid="variant-select"></select></label>
      </div>
      <button class="btn" id="resetTunerBtn">恢复默认参数</button>
    </div>
  </details>

  <div class="modal" id="levelModal"><div class="modal-card"><h2>经验升级</h2><p>选择一个即时强化，然后继续战斗。</p><div class="choices">
    <button class="choice" data-perk="damage"><b>高能弹芯</b>基础伤害 +20%</button><button class="choice" data-perk="rate"><b>过载供能</b>射速 +15%</button><button class="choice" data-perk="repair"><b>重整心防</b>私人空间恢复 20 点</button>
  </div></div></div>
  <div class="modal" id="resultModal"><div class="modal-card"><h2 id="resultTitle">防守完成</h2><p id="resultDesc"></p><div class="result-grid">
    <div><span>击杀</span><b id="resultKills">0</b></div><div><span>合成</span><b id="resultMerges">0</b></div><div><span>消耗</span><b id="resultUses">0</b></div>
  </div><button class="btn primary" id="restartBtn">再来一局</button></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
