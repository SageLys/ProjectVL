<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>魅魔心防战｜可玩原型</title>
</head>
<body>
  <main class="game-shell">
    <header class="game-hud" aria-label="战斗状态">
      <div class="hud-vital">
        <div class="bar"><i id="hpBar"></i></div>
        <span>HP <b id="hpText">100</b> / 100</span>
      </div>
      <div class="hud-progress">
        <strong>波次 <span id="waveText">0</span>/<span id="totalWavesText">5</span></strong>
        <span>Lv.<span id="levelText">1</span> · <span id="xpText">0</span>/<span id="xpNeed">8</span></span>
        <div class="bar xp"><i id="xpBar" style="width:0%"></i></div>
      </div>
      <button class="hud-pause" id="pauseBtn" aria-label="暂停">Ⅱ</button>
    </header>

    <section class="arena" id="arena">
      <canvas id="game" width="540" height="730" aria-label="主画面释放区"></canvas>
      <div class="center-msg" id="centerMsg"><h2>守住心防</h2><p>点击拾取心意，拖卡到画面释放</p></div>
      <div class="start-overlay" id="startOverlay"><button class="btn primary" id="startBtn">开始游戏</button></div>
      <div class="toast" id="toast"></div>
      <div id="upgradeBanner" class="upgrade-banner" aria-live="polite"><strong></strong><span></span></div>
      <div id="celebrationFx" class="celebration-fx" aria-hidden="true"></div>
      <div class="aim-preview" id="aimPreview" aria-hidden="true"><i></i></div>
      <div class="screen-preview" id="screenPreview" aria-hidden="true"></div>
    </section>

    <section class="game-dock" id="dock" aria-label="拇指操作区">
      <div class="dock-row equipment-row" id="equipmentBar">
        <div class="dock-label"><strong>装备</strong><small id="equipmentHint">拖入 3★+ 卡装备</small></div>
        <div class="equipment-slots" id="equipmentSlots" aria-label="装备占位格"></div>
        <div class="dock-telemetry" id="dropTelemetry" hidden>装备卡也可拖到战场释放</div>
      </div>
      <div class="dock-row hand-row">
        <div class="dock-label"><strong>手牌</strong><small id="cardsHint">拖到战场释放 · 同型同星自动合成</small></div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="dock-actions">
        <button class="btn" id="testCardBtn" hidden>生成测试掉落</button>
      </div>
    </section>
  </main>

  <div class="modal" id="levelModal"><div class="modal-card"><h2>经验升级</h2><p>选择一个即时强化，然后继续战斗。</p><div class="choices" id="perkChoices"></div></div></div>
  <div class="modal" id="resultModal"><div class="modal-card"><h2 id="resultTitle">防守完成</h2><p id="resultDesc"></p><div class="result-grid">
    <div><span>击杀</span><b id="resultKills">0</b></div><div><span>合成</span><b id="resultMerges">0</b></div><div><span>消耗</span><b id="resultUses">0</b></div>
  </div><button class="btn primary" id="restartBtn">再来一局</button></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
