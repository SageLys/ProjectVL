<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>魅魔心防战｜可玩原型</title>
</head>
<body>
  <div id="viewportHost" class="viewport-host">
  <div id="safeViewport" class="safe-viewport">
  <main id="gameStage" class="game-stage" data-layout="standard">
    <header class="game-hud" aria-label="战斗状态">
      <div class="hud-status-row">
        <strong class="hud-wave">波次 <span id="waveText">0</span>/<span id="totalWavesText">5</span></strong>
        <small id="statModifierText" class="stat-modifier-hud" hidden></small>
      </div>
      <div class="hud-meter-row">
        <div class="hud-meter hud-meter-hp">
          <span class="hud-meter-label">HP <b id="hpText">100</b>/<b id="maxHpText">100</b></span>
          <div class="bar"><i id="hpBar"></i></div>
        </div>
        <div class="hud-meter hud-meter-reward">
          <span class="hud-meter-label" id="rewardMeterLabel">心防共鸣 <b id="rewardPointsText">0</b>/<b id="rewardThresholdText">10</b></span>
          <div class="bar reward"><i id="rewardBar" style="width:0%"></i></div>
        </div>
      <div class="hud-controls">
        <button class="validation-settle" id="validationSettleBtn" type="button" hidden>奖励结算 12s · 继续</button>
        <button class="hud-speed" id="speedBtn" type="button" aria-label="游戏速度：1倍" title="切换游戏速度">1×</button>
        <button class="hud-pause" id="pauseBtn" type="button" aria-label="暂停">Ⅱ</button>
      </div>
      </div>
    </header>

    <section class="arena" id="arena">
      <canvas id="game" width="540" height="730" aria-label="主画面释放区"></canvas>
      <div class="stage-overlay-root" id="stageOverlayRoot">
        <section class="ready-overlay" id="readyOverlay" aria-labelledby="readyTitle">
          <h2 id="readyTitle">守住心防</h2>
          <p id="readyDescription">点击拾取心意，拖卡到画面释放</p>
          <div class="difficulty-select" role="radiogroup" aria-label="选择难度">
            <button type="button" role="radio" aria-checked="false" data-difficulty="relaxed"></button>
            <button type="button" role="radio" aria-checked="false" data-difficulty="standard"></button>
            <button type="button" role="radio" aria-checked="false" data-difficulty="hard"></button>
            <button type="button" role="radio" aria-checked="false" data-difficulty="hell"></button>
          </div>
          <button class="btn primary" id="startBtn">开始游戏</button>
        </section>
        <div class="stage-message" id="centerMsg" hidden><h2></h2><p></p></div>
      </div>
      <div id="upgradeBanner" class="upgrade-banner" aria-live="polite"><strong></strong><span></span></div>
      <div id="celebrationFx" class="celebration-fx" aria-hidden="true"></div>
      <div class="aim-preview" id="aimPreview" aria-hidden="true"><i></i></div>
      <div class="screen-preview" id="screenPreview" aria-hidden="true"></div>
    </section>

    <section class="game-dock" id="dock" aria-label="拇指操作区">
      <div class="dock-toast" aria-live="polite">
        <div class="toast" id="toast"></div>
      </div>
      <div class="dock-row equipment-row" id="equipmentBar">
        <div class="dock-label"><strong>装备</strong><small id="equipmentHint">拖入 3★+ 卡装备</small></div>
        <div class="equipment-slots" id="equipmentSlots" aria-label="装备占位格"></div>
        <div class="dock-telemetry" id="dropTelemetry" hidden>装备卡也可拖到战场释放</div>
      </div>
      <div class="dock-row hand-row">
        <div class="dock-label"><strong>手牌</strong><small id="cardsHint">拖到战场释放 · 同型同星自动合成</small></div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="dev-test-actions-staging" hidden>
        <button class="btn" id="testCardBtn" hidden>生成测试掉落</button>
        <button class="btn" id="testWildcardBtn" hidden>生成万能卡</button>
      </div>
    </section>
  </main>
  </div>
  </div>

  <div id="globalOverlayRoot" class="global-overlay-root">
  <div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="modal-card"><h2 id="resultTitle">防守完成</h2><p id="resultDesc"></p><div class="result-grid">
    <div><span>击杀</span><b id="resultKills">0</b></div><div><span>合成</span><b id="resultMerges">0</b></div><div><span>消耗</span><b id="resultUses">0</b></div>
  </div><section class="result-score" id="resultScore" hidden><div class="result-total"><span id="resultScoreLabel"></span><b id="resultScoreTotal">0</b></div><div class="result-breakdown" id="resultBreakdown"></div><div class="result-build-meta" id="resultBuildMeta"></div></section><button class="btn primary" id="restartBtn">再来一局</button></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
