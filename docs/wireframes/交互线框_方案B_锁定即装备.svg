<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 900" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="860" height="900" fill="#06101d"/>
  <text x="30" y="34" fill="#e9eef5" font-size="20" font-weight="bold">交互线框 · 方案B：锁定即装备（候选方案）</text>
  <text x="30" y="56" fill="#8ea4bd" font-size="12">竖屏触控 · 双手持机 ｜ 共享池10格（P4前置：~10格才与 7+3 等效） ｜ 2026-07-10</text>

  <!-- ============ 手机框 ============ -->
  <rect x="30" y="80" width="380" height="790" rx="28" fill="#0b1524" stroke="#3b5068" stroke-width="3"/>

  <!-- HUD 条 -->
  <rect x="46" y="96" width="348" height="44" rx="8" fill="#0e1a2c" stroke="#22344a"/>
  <rect x="56" y="108" width="120" height="8" rx="4" fill="#1d3350"/>
  <rect x="56" y="108" width="86" height="8" rx="4" fill="#e0567a"/>
  <text x="56" y="132" fill="#8ea4bd" font-size="10">HP 72/100</text>
  <text x="220" y="118" fill="#e9eef5" font-size="11">波次 4/8</text>
  <text x="220" y="132" fill="#8ea4bd" font-size="10">Lv.5 ▓▓▓░</text>
  <text x="330" y="124" fill="#8ea4bd" font-size="10">⏸</text>

  <!-- 主画面（释放区）：与方案A完全一致 -->
  <rect x="46" y="148" width="348" height="480" rx="10" fill="#081221" stroke="#22344a"/>
  <rect x="54" y="156" width="332" height="464" rx="8" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="7 5" opacity=".55"/>
  <text x="220" y="174" fill="#67e8f9" font-size="10" text-anchor="middle" opacity=".8">① 消耗释放区（与方案A 完全一致）</text>

  <circle cx="220" cy="390" r="22" fill="#12233b" stroke="#d59bff" stroke-width="2"/>
  <text x="220" y="396" fill="#d59bff" font-size="14" text-anchor="middle">⌁</text>
  <circle cx="220" cy="390" r="120" fill="none" stroke="#d59bff" stroke-width="1" stroke-dasharray="2 6" opacity=".3"/>
  <circle cx="110" cy="255" r="9" fill="#37507a"/>
  <circle cx="330" cy="305" r="9" fill="#37507a"/>
  <circle cx="140" cy="530" r="9" fill="#37507a"/>
  <circle cx="320" cy="500" r="13" fill="#503752" stroke="#ffcf5c" stroke-width="2"/>
  <text x="320" y="482" fill="#ffcf5c" font-size="11" text-anchor="middle">⚑ 赏金</text>
  <circle cx="150" cy="335" r="10" fill="#0d2438" stroke="#67e8f9" stroke-width="2"/>
  <path d="M150 325 A10 10 0 0 1 159 340" fill="none" stroke="#ffcf5c" stroke-width="3"/>

  <circle cx="285" cy="290" r="34" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="285" cy="290" r="3.5" fill="#67e8f9"/>
  <circle cx="285" cy="350" r="12" fill="#e9eef5" opacity=".25"/>
  <line x1="285" y1="346" x2="285" y2="297" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrB)"/>
  <rect x="255" y="357" width="44" height="30" rx="6" fill="#67e8f9" opacity=".35"/>
  <text x="277" y="376" fill="#e9eef5" font-size="10" text-anchor="middle">❄2★</text>

  <!-- ============ 底部 dock：共享池 10 格 ============ -->
  <rect x="46" y="636" width="348" height="218" rx="12" fill="#0a1626" stroke="#22344a"/>
  <text x="58" y="660" fill="#e9eef5" font-size="11" font-weight="bold">共享卡池 ②</text>
  <text x="140" y="660" fill="#8ea4bd" font-size="9">10格 · 自动合成 · 单击锁定=装备（≥2★，上限3）</text>

  <!-- 第一行 5 格：2 张锁定 -->
  <g>
    <!-- 锁定卡 1 -->
    <rect x="58" y="670" width="60" height="60" rx="8" fill="#1a1430" stroke="#ffcf5c" stroke-width="2.5"/>
    <text x="88" y="694" fill="#e9eef5" font-size="11" text-anchor="middle">⚡3★</text>
    <text x="88" y="710" fill="#d59bff" font-size="9" text-anchor="middle">连锁</text>
    <circle cx="112" cy="676" r="8" fill="#ffcf5c"/>
    <text x="112" y="680" fill="#06101d" font-size="9" text-anchor="middle">🔒</text>
    <!-- 锁定卡 2 -->
    <rect x="126" y="670" width="60" height="60" rx="8" fill="#1a1430" stroke="#ffcf5c" stroke-width="2.5"/>
    <text x="156" y="694" fill="#e9eef5" font-size="11" text-anchor="middle">❄2★</text>
    <text x="156" y="710" fill="#d59bff" font-size="9" text-anchor="middle">冰冻</text>
    <circle cx="180" cy="676" r="8" fill="#ffcf5c"/>
    <text x="180" y="680" fill="#06101d" font-size="9" text-anchor="middle">🔒</text>
    <!-- 普通卡 -->
    <rect x="194" y="670" width="60" height="60" rx="8" fill="#131c30" stroke="#3b5068"/>
    <text x="224" y="694" fill="#e9eef5" font-size="11" text-anchor="middle">🛡2★</text>
    <text x="224" y="710" fill="#8ea4bd" font-size="9" text-anchor="middle">可锁定</text>
    <rect x="262" y="670" width="60" height="60" rx="8" fill="#131c30" stroke="#3b5068"/>
    <text x="292" y="694" fill="#e9eef5" font-size="11" text-anchor="middle">❄1★</text>
    <text x="292" y="710" fill="#8ea4bd" font-size="9" text-anchor="middle">不可锁</text>
    <rect x="330" y="670" width="52" height="60" rx="8" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
  </g>

  <!-- 第二行 5 格 -->
  <g>
    <rect x="58" y="738" width="60" height="60" rx="8" fill="#131c30" stroke="#3b5068"/>
    <text x="88" y="762" fill="#e9eef5" font-size="11" text-anchor="middle">⚡1★</text>
    <rect x="126" y="738" width="60" height="60" rx="8" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
    <rect x="194" y="738" width="60" height="60" rx="8" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
    <rect x="262" y="738" width="60" height="60" rx="8" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
    <rect x="330" y="738" width="52" height="60" rx="8" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
  </g>

  <!-- 单击锁定注释 -->
  <path d="M224 730 Q224 742 200 748" fill="none" stroke="#ffcf5c" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="58" y="820" fill="#ffcf5c" font-size="10">③ 单击卡面 = 锁定/解锁（无拖拽装备动词）；锁定 3/3 时锁第 4 张 → toast 提示上限</text>
  <text x="58" y="838" fill="#8ea4bd" font-size="9">锁定卡不参与自动合成、不可直接拖拽消耗（先解锁）；同型 2★ 拖到锁定卡上 = 喂养合成</text>

  <!-- ============ 右侧注释列 ============ -->
  <g font-size="12" fill="#c6d3e2">
    <text x="440" y="110" fill="#e9eef5" font-size="14" font-weight="bold">交互注释（仅列与方案A 的差异）</text>

    <text x="440" y="140" fill="#ffcf5c" font-weight="bold">② 共享池取代「手牌+装备」两区</text>
    <text x="440" y="158">10 格单一网格（P4前置：锁 3 后剩 7 格周转，</text>
    <text x="440" y="174">与方案A 的 7+3 经济等效，稳健结论）。</text>
    <text x="440" y="190">锁定卡 = 生效装备：金框 + 🔒 角标 + 底色变化，</text>
    <text x="440" y="206">三重视觉冗余保证战斗中一眼可辨。</text>

    <text x="440" y="236" fill="#ffcf5c" font-weight="bold">③ 锁定规则</text>
    <text x="440" y="254">单击 ≥2★ 卡 = 锁定（上限 3）；再击 = 解锁。</text>
    <text x="440" y="270">单击 1★ 卡 = 无操作（或轻微抖动反馈）。</text>
    <text x="440" y="286">锁定卡冻结于原格：不合成、不被自动整理，</text>
    <text x="440" y="302">拖拽消耗前必须先解锁——防误耗装备。</text>
    <text x="440" y="318">同类型唯一：锁定第二张同型卡被拒（toast）；</text>
    <text x="440" y="334">同型卡拖到锁定卡上 = 喂养合成升星。</text>

    <text x="440" y="364" fill="#67e8f9" font-weight="bold">主画面交互与方案A 完全一致</text>
    <text x="440" y="382" fill="#8ea4bd" font-size="11">消耗释放、落点预览、点击拾取/接赏金均不变，</text>
    <text x="440" y="398" fill="#8ea4bd" font-size="11">保证 A/B 测试只隔离「装备操作」单一变量。</text>

    <rect x="440" y="426" width="390" height="196" rx="10" fill="#0e1a2c" stroke="#22344a"/>
    <text x="456" y="450" fill="#ffcf5c" font-weight="bold">方案B 取舍</text>
    <text x="456" y="472" font-size="11">＋ 装备动词从拖拽降为单击，操作成本最低（触屏友好）</text>
    <text x="456" y="490" font-size="11">＋ 单区界面更干净，dock 高度更矮，主画面多 ~10px</text>
    <text x="456" y="508" font-size="11">＋ 槽位压力与装备数耦合：锁多少张 = 周转紧多少，</text>
    <text x="472" y="524" font-size="11">本身可能是有趣取舍（也可能是挫败源，A/B 验证）</text>
    <text x="456" y="542" font-size="11">－ 「锁定=装备」概念隐晦，首局可读性风险（对照 H3）</text>
    <text x="456" y="560" font-size="11">－ 锁定卡占格：满池时捡不了新卡的挫败需实测</text>
    <text x="456" y="578" font-size="11">－ 需改 core 数据模型（equipment 数组 → locked 标记），</text>
    <text x="472" y="594" font-size="11">A/B 两形态并存期间 core 需同时支持两种模型</text>
    <text x="456" y="612" font-size="11" fill="#8ea4bd">A/B 判据见《交互重设计》文档 §4</text>
  </g>
</svg>
