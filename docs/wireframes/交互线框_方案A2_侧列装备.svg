<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d59bff"/>
    </marker>
  </defs>
  <rect width="900" height="930" fill="#06101d"/>
  <text x="30" y="34" fill="#e9eef5" font-size="20" font-weight="bold">交互线框 · 方案A′：侧列装备（竖列3格 + 手牌 2×5）</text>
  <text x="30" y="56" fill="#8ea4bd" font-size="12">竖屏触控 · 双手持机 ｜ 手牌可扩 7→10（2×5）· 装备竖列3 ｜ 手势按方向分离 ｜ 2026-07-13</text>

  <!-- ============ 手机框 ============ -->
  <rect x="30" y="80" width="380" height="820" rx="28" fill="#0b1524" stroke="#3b5068" stroke-width="3"/>

  <!-- HUD 条 -->
  <rect x="46" y="96" width="348" height="44" rx="8" fill="#0e1a2c" stroke="#22344a"/>
  <rect x="56" y="108" width="120" height="8" rx="4" fill="#1d3350"/>
  <rect x="56" y="108" width="86" height="8" rx="4" fill="#e0567a"/>
  <text x="56" y="132" fill="#8ea4bd" font-size="10">HP 72/100</text>
  <text x="222" y="118" fill="#e9eef5" font-size="11">波次 4/8</text>
  <text x="222" y="132" fill="#8ea4bd" font-size="10">Lv.5 ▓▓▓░</text>
  <text x="332" y="124" fill="#8ea4bd" font-size="10">⏸</text>

  <!-- 主画面（释放区）— 因 dock 变矮而增高 -->
  <rect x="46" y="148" width="348" height="530" rx="10" fill="#081221" stroke="#22344a"/>
  <rect x="54" y="156" width="332" height="514" rx="8" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="7 5" opacity=".5"/>
  <text x="220" y="174" fill="#67e8f9" font-size="10" text-anchor="middle" opacity=".8">① 整个主画面 = 消耗释放区（纵向拖出落点）</text>

  <!-- 炮台 -->
  <circle cx="220" cy="400" r="22" fill="#12233b" stroke="#d59bff" stroke-width="2"/>
  <text x="220" y="406" fill="#d59bff" font-size="14" text-anchor="middle">⌁</text>
  <circle cx="220" cy="400" r="120" fill="none" stroke="#d59bff" stroke-width="1" stroke-dasharray="2 6" opacity=".25"/>

  <!-- 敌人 -->
  <circle cx="110" cy="260" r="9" fill="#37507a"/>
  <circle cx="330" cy="320" r="9" fill="#37507a"/>
  <circle cx="150" cy="560" r="9" fill="#37507a"/>
  <circle cx="320" cy="520" r="13" fill="#503752" stroke="#ffcf5c" stroke-width="2"/>
  <text x="320" y="502" fill="#ffcf5c" font-size="11" text-anchor="middle">⚑ 赏金</text>

  <!-- 掉落（限时环） -->
  <circle cx="150" cy="350" r="10" fill="#0d2438" stroke="#67e8f9" stroke-width="2"/>
  <path d="M150 340 A10 10 0 0 1 159 355" fill="none" stroke="#ffcf5c" stroke-width="3"/>
  <line x1="150" y1="350" x2="92" y2="350" stroke="#8ea4bd" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="60" y="338" fill="#8ea4bd" font-size="9">⑤ 点击=拾取</text>
  <text x="60" y="350" fill="#8ea4bd" font-size="9">/接赏金</text>

  <!-- 释放手势：纵向拖出 + 落点预览环 -->
  <circle cx="255" cy="300" r="30" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="255" cy="300" r="3.5" fill="#67e8f9"/>
  <text x="255" y="262" fill="#67e8f9" font-size="10" text-anchor="middle">落点预览环（AoE）</text>
  <circle cx="255" cy="356" r="12" fill="#e9eef5" opacity=".22"/>
  <text x="274" y="360" fill="#8ea4bd" font-size="10">手指</text>
  <line x1="255" y1="352" x2="255" y2="308" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="262" y="334" fill="#67e8f9" font-size="9">Δy 偏移</text>
  <rect x="235" y="360" width="40" height="28" rx="6" fill="#67e8f9" opacity=".3"/>
  <text x="255" y="378" fill="#e9eef5" font-size="9" text-anchor="middle">❄2★</text>

  <!-- ============ 底部 dock（矮：约2行高） ============ -->
  <rect x="46" y="686" width="348" height="188" rx="12" fill="#0a1626" stroke="#22344a"/>

  <!-- 波间信息：细长满宽条，填满顶部避免空白 -->
  <text x="58" y="708" fill="#8ea4bd" font-size="9">下一波 00:07 · 地面 2 · 拾取 23</text>

  <!-- 分区标题 -->
  <text x="58" y="730" fill="#e9eef5" font-size="11" font-weight="bold">手牌 ④</text>
  <text x="102" y="730" fill="#8ea4bd" font-size="9">2×5 · 自动合成 · 上限3★</text>
  <text x="318" y="730" fill="#e9c8ff" font-size="11" font-weight="bold">装备 ②</text>

  <!-- 手牌 2×5 栅格 -->
  <g>
    <!-- row1 -->
    <rect x="54" y="738" width="48" height="46" rx="7" fill="#131c30" stroke="#3b5068"/>
    <text x="78" y="765" fill="#e9eef5" font-size="10" text-anchor="middle">❄1★</text>
    <rect x="107" y="738" width="48" height="46" rx="7" fill="#131c30" stroke="#3b5068"/>
    <text x="131" y="765" fill="#e9eef5" font-size="10" text-anchor="middle">⚡1★</text>
    <rect x="160" y="738" width="48" height="46" rx="7" fill="#131c30" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="184" y="765" fill="#e9eef5" font-size="10" text-anchor="middle">❄2★</text>
    <rect x="213" y="738" width="48" height="46" rx="7" fill="#131c30" stroke="#3b5068"/>
    <text x="237" y="765" fill="#e9eef5" font-size="10" text-anchor="middle">🛡1★</text>
    <rect x="266" y="738" width="48" height="46" rx="7" fill="#131c30" stroke="#3b5068"/>
    <text x="290" y="765" fill="#e9eef5" font-size="10" text-anchor="middle">⚡2★</text>
    <!-- row2 -->
    <rect x="54" y="790" width="48" height="46" rx="7" fill="#131c30" stroke="#3b5068"/>
    <text x="78" y="817" fill="#e9eef5" font-size="10" text-anchor="middle">✦1★</text>
    <rect x="107" y="790" width="48" height="46" rx="7" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
    <rect x="160" y="790" width="48" height="46" rx="7" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
    <rect x="213" y="790" width="48" height="46" rx="7" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
    <rect x="266" y="790" width="48" height="46" rx="7" fill="none" stroke="#3b5068" stroke-dasharray="4 4"/>
    <text x="288" y="856" fill="#8ea4bd" font-size="9" text-anchor="middle" opacity=".8">第2行 = 手牌扩容 7→10 时启用</text>
  </g>

  <!-- 装备竖列（右缘，横跨两行高度） -->
  <g>
    <rect x="320" y="738" width="64" height="40" rx="8" fill="#131c30" stroke="#d59bff" stroke-width="1.5"/>
    <text x="352" y="758" fill="#e9eef5" font-size="10" text-anchor="middle">⚡3★</text>
    <text x="352" y="771" fill="#d59bff" font-size="8" text-anchor="middle">连锁</text>
    <rect x="320" y="784" width="64" height="40" rx="8" fill="#131c30" stroke="#d59bff" stroke-width="1.5"/>
    <text x="352" y="804" fill="#e9eef5" font-size="10" text-anchor="middle">❄2★</text>
    <text x="352" y="817" fill="#d59bff" font-size="8" text-anchor="middle">冰冻</text>
    <rect x="320" y="830" width="64" height="40" rx="8" fill="none" stroke="#d59bff" stroke-width="1.2" stroke-dasharray="5 4" opacity=".5"/>
    <text x="352" y="854" fill="#d59bff" font-size="9" text-anchor="middle" opacity=".55">装备3</text>
  </g>

  <!-- 装备手势：横向拖入侧列 -->
  <path d="M300 762 Q314 770 330 792" fill="none" stroke="#d59bff" stroke-width="1.6" marker-end="url(#arrP)"/>
  <text x="300" y="726" fill="#d59bff" font-size="9" text-anchor="end" opacity="0"> </text>

  <!-- 方向分离图注（内嵌小标） -->
  <text x="150" y="726" fill="#67e8f9" font-size="9" opacity=".9">↑ 纵向=释放</text>
  <text x="300" y="726" fill="#d59bff" font-size="9" opacity=".9">→ 横向=装备</text>

  <!-- ============ 右侧注释列 ============ -->
  <g font-size="12" fill="#c6d3e2">
    <text x="440" y="110" fill="#e9eef5" font-size="14" font-weight="bold">交互注释（方案A′）</text>

    <text x="440" y="142" fill="#d59bff" font-weight="bold">① 装备改「竖列侧栏」（本次改动核心）</text>
    <text x="440" y="160">3 格竖排贴右缘，高度横跨手牌两行。</text>
    <text x="440" y="176">竖列天然填满高度 → 消除原横排的「半边空」；</text>
    <text x="440" y="192">装备复用两行高度 → dock 少一整行，省竖向空间。</text>

    <text x="440" y="222" fill="#67e8f9" font-weight="bold">② 手势按方向分离（消除走廊歧义）</text>
    <text x="440" y="240">纵向拖出手牌 = 释放到落点（走廊清空）；</text>
    <text x="440" y="256">横向拖入右侧列 = 装备。两手势方向正交，</text>
    <text x="440" y="272">不再共用同一条上行走廊、不再误触。</text>
    <text x="440" y="288" fill="#8ea4bd" font-size="11">远端手牌→侧列拖拽较长，可双击/长按装备兜底。</text>

    <text x="440" y="318" fill="#67e8f9" font-weight="bold">③ 手牌 2×5 可伸缩</text>
    <text x="440" y="336">7→10 只是「加一行」，装备列位置不变；</text>
    <text x="440" y="352">布局随手牌规模稳定，无需为扩容重排。</text>

    <text x="440" y="382" fill="#67e8f9" font-weight="bold">④ 触控尺寸</text>
    <text x="440" y="400">手牌格 48px、装备格 64px，均 ≥ 触控下限；</text>
    <text x="440" y="416">Δy 偏移 / 预览环样式沿用 T1 校准。</text>

    <text x="440" y="446" fill="#67e8f9" font-weight="bold">⑤ 点击动词复用（P2 定案）</text>
    <text x="440" y="464">主画面单击 = 拾取最近掉落 / 接精英赏金；</text>
    <text x="440" y="480">按下位移 &lt; 8px 判点击，与拖拽区分。</text>

    <rect x="440" y="510" width="430" height="176" rx="10" fill="#0e1a2c" stroke="#22344a"/>
    <text x="456" y="534" fill="#ffcf5c" font-weight="bold">方案A′ 取舍（相对原横排A）</text>
    <text x="456" y="558" font-size="11">＋ 竖列填满高度，无半边空</text>
    <text x="456" y="578" font-size="11">＋ dock 约 2 行高，主画面较原方案 +~60px 竖向空间</text>
    <text x="456" y="598" font-size="11">＋ 释放/装备按方向正交分离，消除走廊落点歧义</text>
    <text x="456" y="618" font-size="11">＋ 手牌可扩 7→10，装备布局不受影响</text>
    <text x="456" y="640" font-size="11" fill="#f4a6b8">－ 手牌格降到 ~48px（仍 ≥ 触控下限）</text>
    <text x="456" y="660" font-size="11" fill="#f4a6b8">－ 装备移右缘，与右拇指点战场轻微竞争</text>
    <text x="456" y="678" font-size="11" fill="#8ea4bd">远端手牌→侧列拖拽较长，双击/长按兜底</text>
  </g>
</svg>
